[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofjson"
version = "0.1.0"
description = "A trust layer for LLM extraction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "JonColin (JC) Senka" }]
keywords = ["pdf", "json-schema", "llm", "extraction", "evidence", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "pydantic>=2.6",
  "pypdf>=5.1",
  "typer>=0.12",
  "typing-extensions>=4.5; python_version < '3.11'",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "reportlab>=4.2",
]

[project.urls]
Homepage = "https://github.com/jcsenka013-lgtm/proofjson"
Repository = "https://github.com/jcsenka013-lgtm/proofjson"
Issues = "https://github.com/jcsenka013-lgtm/proofjson/issues"

[project.scripts]
proofjson = "proofjson.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["proofjson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
